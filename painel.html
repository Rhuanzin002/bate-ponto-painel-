<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Gestor - Controle de Ponto</title>
    <link rel="stylesheet" href="painel.css">
</head>
<body>

    <!-- Tela de login -->
    <div id="tela-login" class="login-wrapper">
        <div class="card login-card">
            <h2>Acesso ao Painel</h2>
            <input type="password" id="campo-senha" placeholder="Digite a senha" autocomplete="current-password">
            <button id="btn-entrar" class="btn-entrar">Entrar</button>
            <p id="erro-login" class="erro-login"></p>
        </div>
    </div>

    <!-- Painel (só aparece depois do login) -->
    <div id="painel" class="container" hidden>
        <header>
            <h1>Painel de Controle - Diárias</h1>
            <p>Gerenciamento de pontos, pagamentos e auditoria.</p>
            <button id="btn-sair" class="btn-sair">Sair</button>
        </header>

        <!-- Seção de Resumo / Pagamento por Funcionário -->
        <section class="card">
            <h2>Resumo para Pagamento (Pendentes)</h2>
            <div class="table-responsive">
                <table id="tabela-resumo">
                    <thead>
                        <tr>
                            <th>Funcionário</th>
                            <th>Pontos Pendentes</th>
                            <th>Valor da Diária (R$)</th>
                            <th>Total a Pagar (R$)</th>
                            <th>Ação</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Preenchido via JavaScript -->
                    </tbody>
                </table>
            </div>
        </section>

        <!-- Seção de Histórico Completo / Auditoria (Desconsiderar pontos) -->
        <section class="card">
            <h2>Histórico de Pontos Batidos</h2>
            <div class="table-responsive">
                <table id="tabela-historico">
                    <thead>
                        <tr>
                            <th>Funcionário</th>
                            <th>Data e Hora</th>
                            <th>Status</th>
                            <th>Ação</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Preenchido via JavaScript -->
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <script src="painel.js"></script>
</body>
</html>
